app:
  name: "platform-lifecycle-orchestrator"
  version: "1.0.0"

api:
  majorVersion: "v1"

http:
  host: "0.0.0.0"
  port: "8081"

mcp:
  serverName: "platform-lifecycle-orchestrator"
  serverVersion: "1.0.0"

github:
  apiBase: "https://api.github.com"   # override per-app for GitHub Enterprise
  defaultOwner: "Avatansh-GitHub"    # convention fallback: org/user that owns target repos
  defaultBranch: "main"             # fallback only; ARM/GitHub/registry/request can override
  
naming:                            # convention used when an app is NOT in the registry
  repoEqualsAppName: "true"       # repo = appName
  appPathAtRoot: "true"          # app module sits at repo root ("." )
  
anypoint:
  apiBase: "https://anypoint.mulesoft.com"
  defaultOrgId: "2e14f8c6-4d60-481b-bfb6-798695efc8f4"  # used if ARM lookup not run
  
slack:    { channel: "#java17-upgrades" }

jira:     { baseUrl: "https://your-org.atlassian.net", host: "your-org.atlassian.net" }

matrix:
  path: "matrix/compatibility-matrix.yaml"   # classpath copy — packaged in the app; used as fallback
  source: "exchange-latest"                  # exchange | exchange-latest | classpath.
                                             #   exchange        = central governance at the pinned version below
                                             #   exchange-latest = auto-adopt newest published version (reads maven-metadata.xml)
                                             #   classpath       = bundled copy only (offline/tests)
  refreshSeconds: "300"                       # re-fetch window when source=exchange* (matrix cache TTL)
  exchange:                                   # coordinates of the matrix asset published to Anypoint Exchange
    orgId: "2e14f8c6-4d60-481b-bfb6-798695efc8f4"
    assetId: "java17-compatibility-matrix"
    version: "1.0.1"                          # bump when you publish a new matrix version (or use source=exchange-latest)
    classifier: "custom"                      # Exchange custom-asset classifier — part of the Maven filename ("" if none)
    packaging: "yaml"                         # main file extension of the published asset

registry:                          # OPTIONAL — see governance note
  path: "registry/app-registry.yaml"   # appName → repo coordinates
  enforceAllowList: "false"      # true = ONLY registered apps may be upgraded (governance)
  
osv2:     { jobTtlSeconds: "2592000" }   # 30d rolling

job:      { maxConcurrentPerApp: "1" }     # single-flight

reconcile:                                 # self-healing sweep
  frequencyMillis: "300000"               # run every 5 minutes
  staleSeconds:    "900"                  # job is stale after 15 minutes without updatedAt change
