# =============================================================================
# config.yaml — ENVIRONMENT-CONSTANT settings ONLY.
# Values here are identical across dev / test / prod. Anything that varies per
# environment (owners, org IDs, hosts, channels, governance toggles) lives in
# config-<env>.yaml, which is loaded FIRST and therefore overrides this file.
# =============================================================================

app:
  name: "platform-lifecycle-orchestrator"
  version: "1.0.0"

api:
  majorVersion: "v1"

http:
  host: "0.0.0.0"                        # bind address is the same everywhere (port is per-env)

mcp:
  serverName: "platform-lifecycle-orchestrator"
  serverVersion: "1.0.0"

github:
  apiBase: "https://api.github.com"      # constant (override in an env file only for GitHub Enterprise)
  defaultBranch: "main"                  # convention fallback; registry/request/discovery can override

naming:                                  # convention used when an app is NOT in the registry
  repoEqualsAppName: "true"              # repo = appName
  appPathAtRoot: "true"                  # app module sits at repo root (".")

anypoint:
  apiBase: "https://anypoint.mulesoft.com"
  tokenPath: "/accounts/api/v2/oauth2/token"   # Connected App client_credentials token endpoint
  tokenRefreshSeconds: "3300"                  # cache bearer ~55 min (platform TTL is 60 min)
  verify:
    # AMC/CH2.0 deployment statuses treated as a healthy/successful deploy (comma-separated, upper-case).
    healthyStatuses: "RUNNING,APPLIED,STARTED,PARTIALLY_STARTED"

matrix:
  path: "matrix/compatibility-matrix.yaml"   # classpath copy — packaged in the app; used as fallback
  source: "exchange-latest"                  # exchange | exchange-latest | classpath
  refreshSeconds: "86400"                    # matrix cache TTL = 1 day (bucketed floor(epoch/refreshSeconds))
  exchange:                                  # Exchange asset IDENTITY (orgId is env-specific → env file)
    assetId: "java17-compatibility-matrix"
    version: "1.0.1"                         # bump when you publish a new matrix version (or use source=exchange-latest)
    classifier: "custom"                     # Exchange custom-asset classifier ("" if none)
    packaging: "yaml"                        # main file extension of the published asset

registry:
  path: "registry/app-registry.yaml"         # appName → repo coordinates

osv2:                                        # Object Store v2 partition TTLs (seconds)
  jobTtlSeconds:         "2592000"           # jobStore         — job records, 30d rolling
  lockTtlSeconds:        "86400"             # locksStore       — single-flight locks, 1d safety net
  idempotencyTtlSeconds: "172800"            # idempotencyStore — webhook delivery de-dup keys, 2d
  indexTtlSeconds:       "2592000"           # indexStore       — branch→jobId correlation index, 30d

job:
  maxConcurrentPerApp: "1"                   # single-flight

reconcile:                                   # self-healing sweep — production defaults
  frequencyMillis: "300000"                  # run every 5 minutes  (dev overrides to 30s)
  staleSeconds:    "900"                     # job stale after 15 minutes idle (dev overrides to 2 min)
